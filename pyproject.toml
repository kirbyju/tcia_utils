[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tcia_utils"
version = "4.0.0a1"
authors = [{ name="Justin Kirby", email="justin.kirby@nih.gov" }]
description = "A small Python client for TCIA research discovery and evidence."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = ["httpx>=0.27,<1"]

[project.urls]
"Homepage" = "https://github.com/kirbyju/tcia_utils"
"Bug Tracker" = "https://github.com/kirbyju/tcia_utils/issues"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "build>=1",
]
tables = ["pandas>=2"]
examples = ["pandas>=2", "idc-index", "nbformat>=5"]

[tool.hatch.build]
exclude = [
  "/src/tcia_utils/datacite.py",
  "/src/tcia_utils/idc.py",
  "/src/tcia_utils/nbia.py",
  "/src/tcia_utils/nbia_v4.py",
  "/src/tcia_utils/pathdb.py",
  "/src/tcia_utils/utils.py",
  "/src/tcia_utils/wordpress.py",
  "/tests/test_idc.py",
  "/tests/test_idc_download_fix.py",
  "/tests/test_nbia.py",
  "/tests/test_nbia_v4.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tcia_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_v4_*.py"]
